name: tests
on: [push, pull_request]
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: shim reference + payload layout tests
        run: cd lisp/model && python3 test_shim.py && python3 test_layout.py
      - name: DAVEGA screen tests - golden images, draw budget, field sweeps
        run: python3 davega/tests/test_screens.py
      - name: DAVEGA theme tests - every theme through the same harness
        run: python3 davega/tests/test_themes.py
      - name: DAVEGA UI tests - all five screens, buttons, menu, conversions
        run: python3 davega/tests/test_ui.py
      - name: ESC wire protocol - request, parse, reject
        run: python3 davega/tests/test_vesc.py
      - name: Buttons - debounce, hold, repeat
        run: python3 davega/tests/test_input.py
      - name: Main loop - telemetry, staleness, failure
        run: python3 davega/tests/test_runner.py
      - name: Session accumulation - trip, lifetime, the fields they left TODO
        run: python3 davega/tests/test_session.py
      - name: Boot path - start.py wiring, persistence, escape hatch
        run: python3 davega/tests/test_boot.py

  lisp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: run the shipped Lisp in the upstream LispBM REPL
        run: ./lisp/tests/run-lisp-tests.sh

  protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: confirm the 6.00 vs 7.x protocol claim still holds
        run: ./lisp/tests/protocol-diff.sh
